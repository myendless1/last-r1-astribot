data:
  dataset_root: /media/damoxing/datasets/vae4d/lerobot-vae4d-org/astribot/centrifuge_multidrop-f2
  dataset_name: astribot_centrifuge_multidrop
  statistics_path: assets/astribot_dataset_statistics.json
  image_keys:
    - observation.images.cam_main
    - observation.images.cam_left_wrist
    - observation.images.cam_right_wrist
  num_images_in_input: 3
  use_proprio: true
  action_token_len: 16
  action_chunks_len: 8
  frame_stride: 1           # stride between training samples within an episode
  action_frame_stride: 4    # stride between actions inside each chunk (50Hz -> 80ms)
  val_episode_ratio: 0.05
  max_prompt_length: 576
  max_total_length: 704
  center_crop: true
  image_size: null
  image_sizes:
    observation.images.cam_main: [320, 256]
    observation.images.cam_left_wrist: [160, 128]
    observation.images.cam_right_wrist: [160, 128]
  train_batch_size: 8        # per GPU (global = 8 * num_gpus)
  micro_batch_size: 8         # per GPU micro batch; grad_accum = train / micro
  num_workers: 8
  limit_episodes: null
  val_max_frames: 10000      # cap validation set size (subsampled with trainer.seed)

model:
  partial_pretrain: /media/damoxing/ckp/qwen_ft/Qwen3-VL-2B-Instruct
  trust_remote_code: true
  action_special_tokens: 256
  need_to_sub: 3
  use_latent: false
  freeze_vision: true
  attn_implementation: null   # auto sdpa when freeze_vision=false (flash_attn NaNs on trainable vision)
  enable_gradient_checkpointing: true
  fsdp_config:
    wrap_policy:
      min_num_params: 0
    cpu_offload: false
    offload_params: false

optim:
  lr: 1.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps_ratio: 0.01
  clip_grad: 1.0

trainer:
  default_local_dir: /tmp/astribot_vla_sft
  default_hdfs_dir: null
  project_name: last_r1
  experiment_name: astribot-filter-300-oneshot
  total_epochs: 2
  save_freq: 500
  test_freq: 2000           # run validation every N training steps (not per epoch)
  profile_steps: null
  profile_warmup_steps: 10
  logger: ['console', 'wandb']
  wandb_mode: online
  seed: 42
